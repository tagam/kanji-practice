<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>かんけん10きゅう</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #eef7f0;
    --card: #ffffff;
    --text: #23362a;
    --muted: #6d8474;
    --accent: #3fae6a;
    --accent-dark: #2a8a50;
    --accent-text: #ffffff;
    --ok: #2e9e5b;
    --ok-bg: #e3f6eb;
    --ng: #d9534f;
    --ng-bg: #fdeaea;
    --mid: #e0a100;
    --mid-bg: #fff4d1;
    --border: #cfe3d4;
    --input-bg: #fbfffc;
    --tile-bg: #e4f5e9;
    --hl: #fff09a;
    --pen: #23362a;
    --model: rgba(217, 83, 79, .35);
    --pink: #ff8fb8;
    --pink-dark: #e0608f;
    --pink-text: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #141c17;
      --card: #1d2820;
      --text: #e4f1e7;
      --muted: #94ab9a;
      --accent: #4cc47c;
      --accent-dark: #6fdc9a;
      --accent-text: #08230f;
      --ok: #5ed492;
      --ok-bg: #1f3a2b;
      --ng: #ff8a85;
      --ng-bg: #43211f;
      --mid: #ffd25e;
      --mid-bg: #3d3216;
      --border: #34463a;
      --input-bg: #18211b;
      --tile-bg: #233a2a;
      --hl: #5a5016;
      --pen: #e4f1e7;
      --model: rgba(255, 138, 133, .4);
      --pink: #ff8fb8;
      --pink-dark: #ff6fa3;
      --pink-text: #3a0d1f;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #141c17;
    --card: #1d2820;
    --text: #e4f1e7;
    --muted: #94ab9a;
    --accent: #4cc47c;
    --accent-dark: #6fdc9a;
    --accent-text: #08230f;
    --ok: #5ed492;
    --ok-bg: #1f3a2b;
    --ng: #ff8a85;
    --ng-bg: #43211f;
    --mid: #ffd25e;
    --mid-bg: #3d3216;
    --border: #34463a;
    --input-bg: #18211b;
    --tile-bg: #233a2a;
    --hl: #5a5016;
    --pen: #e4f1e7;
    --model: rgba(255, 138, 133, .4);
    --pink: #ff8fb8;
    --pink-dark: #ff6fa3;
    --pink-text: #3a0d1f;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); overscroll-behavior: none; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "BIZ UDGothic", "Yu Gothic", system-ui, sans-serif;
    line-height: 1.6;
    min-height: 100%;
  }
  /* かんじは きょうかしょたいで（かくすうが わかりやすい） */
  .kj { font-family: "UD Digi Kyokasho NK-R", "UDデジタル教科書体 NK-R", "UD Digi Kyokasho N-R", "YuKyokasho", "Klee", "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 400; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 48px; }
  h1 { font-size: 1.5rem; text-align: center; margin: 8px 0 2px; }
  .sub { text-align: center; color: var(--muted); font-size: .85rem; margin: 0 0 18px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 22px 18px;
    margin-bottom: 14px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  button {
    font-family: inherit;
    border: none;
    border-radius: 16px;
    cursor: pointer;
    font-weight: 700;
    -webkit-tap-highlight-color: transparent;
  }
  .btn-big {
    display: block;
    width: 100%;
    padding: 16px;
    font-size: 1.15rem;
    background: var(--accent);
    color: var(--accent-text);
    margin-top: 10px;
  }
  .btn-big:active { background: var(--accent-dark); }
  .btn-big:disabled { opacity: .45; cursor: default; }
  .btn-sub {
    display: block;
    width: 100%;
    padding: 13px;
    font-size: 1rem;
    background: transparent;
    color: var(--text);
    border: 2px solid var(--border);
    margin-top: 10px;
  }
  .progress { text-align: center; color: var(--muted); font-weight: 700; margin-bottom: 12px; }
  .bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-bottom: 18px; }
  .bar i { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .3s; }

  /* もんだい */
  .qtype {
    display: table;
    margin: 0 auto 10px;
    padding: 2px 14px;
    border-radius: 999px;
    background: var(--tile-bg);
    color: var(--accent-dark);
    font-size: .85rem;
    font-weight: 800;
  }
  .qtext { text-align: center; font-size: 1rem; color: var(--muted); margin: 0 0 12px; }
  .sentence { text-align: center; font-size: 1.5rem; line-height: 1.9; margin: 4px 0 18px; word-break: keep-all; overflow-wrap: anywhere; }
  .sentence .hl { background: var(--hl); border-bottom: 3px solid var(--accent); padding: 0 4px; border-radius: 4px; }
  .sentence .hl.kj { font-size: 2.3rem; }
  .big-kanji { text-align: center; font-size: 6rem; line-height: 1.2; margin: 0 0 14px; }
  .big-emoji { text-align: center; font-size: 5rem; line-height: 1.2; margin: 0 0 14px; }
  .choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .choice {
    padding: 10px 4px;
    font-size: 2.6rem;
    line-height: 1.3;
    background: var(--tile-bg);
    color: var(--text);
    border: 3px solid var(--accent);
    box-shadow: 0 4px 0 var(--accent-dark);
  }
  .choice.num { font-family: inherit; font-size: 1.8rem; padding: 14px 4px; }
  .choice:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--accent-dark); }

  /* ひらがなカード（よみ） */
  .slots { display: flex; justify-content: center; gap: 6px; margin-bottom: 18px; }
  .slot {
    flex: 0 1 56px;
    min-width: 0;
    height: 62px;
    border: 3px dashed var(--border);
    border-radius: 12px;
    background: var(--input-bg);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 800;
  }
  .pool { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; min-height: 64px; padding: 4px 0; }
  .tile {
    width: 56px;
    height: 60px;
    border-radius: 12px;
    background: var(--tile-bg);
    color: var(--text);
    border: 2px solid var(--accent);
    box-shadow: 0 3px 0 var(--accent-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.8rem;
    font-weight: 800;
    cursor: pointer;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  .slot .tile { width: 100%; height: 100%; font-size: inherit; box-shadow: none; }
  .tile.dragging { position: relative; z-index: 10; box-shadow: 0 8px 18px rgba(0,0,0,.25); }

  /* てがき（かきとり） */
  .pad {
    position: relative;
    width: min(280px, 100%);
    aspect-ratio: 1;
    margin: 0 auto 10px;
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    border: 3px solid var(--accent);
    border-radius: 12px;
    background:
      linear-gradient(to right, transparent calc(50% - 1px), var(--border) calc(50% - 1px), var(--border) calc(50% + 1px), transparent calc(50% + 1px)),
      linear-gradient(to bottom, transparent calc(50% - 1px), var(--border) calc(50% - 1px), var(--border) calc(50% + 1px), transparent calc(50% + 1px)),
      var(--input-bg);
  }
  .pad canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  .pad .model { position: absolute; inset: 0; pointer-events: none; }
  .pad .model svg { width: 100%; height: 100%; }
  .pad .model path { fill: none; stroke: var(--model); stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; }
  .pad .verdict { position: absolute; right: 6px; top: 2px; font-size: 3rem; line-height: 1; pointer-events: none; }
  .fb-compare { display: flex; justify-content: center; gap: 10px; margin: 0 0 10px; }
  .fb-compare figure { margin: 0; }
  .fb-compare figcaption { font-size: .8rem; color: var(--muted); }
  .fb-compare img, .fb-compare .stroke-box svg { width: 140px; height: 140px; border: 3px solid var(--border); border-radius: 14px; background: var(--input-bg); }
  .fb-compare .stroke-box { margin: 0; }
  .btn-override { background: transparent; color: var(--muted); font-size: .85rem; font-weight: 400; text-decoration: underline; padding: 6px; margin: 4px auto 0; display: block; }
  .pad-tools { display: flex; gap: 8px; }
  .pad-tools button { flex: 1; padding-left: 4px; padding-right: 4px; }
  .pad-tools .btn-big { flex: 1.4; }
  .judge { display: flex; gap: 10px; }
  .judge button { flex: 1; }
  .btn-ok { background: var(--ok); color: #fff; }
  .btn-ng { background: var(--ng); color: #fff; }

  /* こたえあわせ */
  .feedback { text-align: center; padding: 10px 0 4px; }
  .feedback .mark { font-size: 3rem; line-height: 1.2; }
  .feedback .ans-kanji { font-size: 4.5rem; line-height: 1.2; margin: 4px 0 0; color: var(--text); }
  .feedback .ans-line { font-size: 1.3rem; color: var(--text); margin: 4px 0; }
  .feedback .ans-info { font-size: .95rem; color: var(--muted); }
  .feedback.ok .lbl { color: var(--ok); font-weight: 800; }
  .feedback.ng .lbl { color: var(--ng); font-weight: 800; }
  .feedback .yours { font-size: 1rem; color: var(--muted); margin-top: 4px; }

  /* けっか */
  .result-score { text-align: center; font-size: 2.4rem; font-weight: 800; margin: 6px 0; }
  .pass { text-align: center; font-size: 1.6rem; font-weight: 800; margin: 4px 0; }
  .pass.ok { color: var(--ok); }
  .pass.ng { color: var(--ng); }
  .miss-list { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 14px 0; }
  .miss-list b { background: var(--ng-bg); color: var(--ng); border-radius: 10px; padding: 2px 12px; font-size: 1.6rem; }

  .row { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 14px; color: var(--muted); font-size: .95rem; }
  .row input { width: 22px; height: 22px; accent-color: var(--accent); }
  .summary { text-align: center; font-size: 1.05rem; margin: 4px 0 0; }
  .note { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 10px; }
  .legend { color: var(--muted); font-size: .85rem; text-align: center; margin: 0 0 12px; }
  .set-title { text-align: center; font-weight: 700; margin: 14px 0 0; }
  /* いちまるの しゅうごとの いろ */
  .week { --wk: #c96a00; margin-top: 14px; }
  .week.w2 { --wk: #3f8f2a; }
  .week.w3 { --wk: #d0452c; }
  .week.w4 { --wk: #3a74bd; }
  .week.w5 { --wk: #c9497f; }
  .week-head { background: var(--wk); color: #fff; font-weight: 800; text-align: center; border-radius: 12px 12px 0 0; padding: 4px; letter-spacing: .1em; }
  .week-body { border: 3px solid var(--wk); border-top: none; border-radius: 0 0 14px 14px; padding: 10px; }
  .week .sets { margin-top: 0; }
  .week .set-btn { background: var(--wk); color: #fff; }
  .week .set-btn:active { filter: brightness(.9); }
  .week .btn-sub { margin-top: 10px; border-color: var(--wk); }
  .kmap .week-label { grid-column: 1 / -1; color: var(--wk); font-weight: 800; border-bottom: 3px solid var(--wk); margin-top: 6px; }
  .sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 10px; margin-top: 8px; }
  .set-btn { padding: 10px 6px; font-size: 1.1rem; line-height: 1.3; background: var(--accent); color: var(--accent-text); }
  .set-btn:active { background: var(--accent-dark); }
  .set-btn small { display: block; font-size: .8rem; opacity: .9; }
  .set-btn .kj { display: block; font-size: 1rem; letter-spacing: .05em; }
  .btn-mock { background: #4a7bd6; color: #fff; }
  .btn-mock:active { background: #3561b5; }

  /* かんじマップ */
  .kmap { display: grid; grid-template-columns: repeat(auto-fill, minmax(52px, 1fr)); gap: 6px; }
  .kcell {
    border: 3px solid var(--border);
    border-radius: 12px;
    text-align: center;
    padding: 2px 0;
    background: var(--input-bg);
    color: var(--text);
  }
  .kcell .kj { display: block; font-size: 1.9rem; line-height: 1.3; }
  .kcell small { display: block; font-size: .65rem; color: var(--muted); }
  .kcell.lv-g { border-color: var(--ok); background: var(--ok-bg); }
  .kcell.lv-y { border-color: var(--mid); background: var(--mid-bg); }
  .kcell.lv-r { border-color: var(--ng); background: var(--ng-bg); }

  /* ガチャ・ずかん（スペルれんしゅうと おなじ しくみ） */
  .btn-gacha { background: var(--pink); color: var(--pink-text); }
  .btn-gacha:active { background: var(--pink-dark); }
  .gacha-left { text-align: center; color: var(--muted); font-weight: 700; margin: 0; }
  .gacha-left.complete, .legend.complete { color: var(--pink-dark); font-size: 1.3rem; font-weight: 800; }
  .gacha-stage { display: flex; justify-content: center; align-items: center; min-height: 250px; }
  .capsule {
    position: relative;
    width: 150px;
    height: 150px;
    border-radius: 50%;
    border: 4px solid var(--pink-dark);
    background: linear-gradient(to bottom, var(--pink) 0 50%, var(--card) 50% 100%);
  }
  .capsule::after { content: ""; position: absolute; left: -4px; right: -4px; top: calc(50% - 4px); height: 8px; background: var(--pink-dark); }
  .capsule.shake { animation: shake .25s ease-in-out 5; }
  @keyframes shake { 0%, 100% { transform: rotate(0); } 25% { transform: rotate(-14deg); } 75% { transform: rotate(14deg); } }
  .prize {
    width: 210px;
    border: 4px solid var(--border);
    border-radius: 20px;
    background: var(--card);
    padding: 16px 10px;
    text-align: center;
    animation: pop .45s ease-out;
  }
  .prize .em { font-size: 4rem; line-height: 1.15; }
  .prize .kj { font-size: 3rem; line-height: 1.1; }
  .prize .nm { font-size: 1.1rem; font-weight: 800; }
  .prize .rr { font-size: .95rem; color: var(--muted); font-weight: 700; }
  .prize .nw { font-weight: 800; color: var(--pink-dark); min-height: 1.6em; }
  .prize.rare { border-color: var(--pink); }
  .prize.kira, .zcell.kira {
    border-color: #e6b422;
    background: linear-gradient(135deg, #fff7cc, #ffd9ef, #d9ecff, #fff7cc);
    background-size: 300% 300%;
  }
  .prize.kira { animation: pop .45s ease-out, shimmer 3s linear infinite; }
  .prize.kira .nm, .prize.kira .rr, .prize.kira .kj, .zcell.kira .nm, .zcell.kira .ct, .zcell.kira .kj { color: #3d2f1e; }
  @keyframes pop { from { transform: scale(.3); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes shimmer { to { background-position: 300% 300%; } }
  .zukan { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; margin-bottom: 6px; }
  .zcell { min-width: 0; border: 3px solid var(--border); border-radius: 14px; padding: 6px 2px; text-align: center; }
  .zcell .em { font-size: 2rem; line-height: 1.2; }
  .zcell .kj { font-size: 1.5rem; line-height: 1.1; }
  .zcell .nm { font-size: .7rem; font-weight: 700; overflow-wrap: anywhere; }
  .zcell .ct { font-size: .7rem; color: var(--muted); min-height: 1.2em; }
  .zcell.rare { border-color: var(--pink); }
  .zcell.none { background: transparent; border-style: dashed; }
  .zcell.none .em, .zcell.none .nm, .zcell.none .kj { color: var(--muted); }
  @media (prefers-reduced-motion: reduce) {
    .capsule.shake, .prize, .prize.kira { animation: none; }
  }
  /* ほんばんと おなじ もんだいの かたち */
  .sentence .box {
    display: inline-block;
    min-width: 2.2em;
    border: 3px dashed var(--accent);
    border-radius: 8px;
    background: var(--hl);
    padding: 0 6px;
    line-height: 1.5;
  }
  .choices.nums { grid-template-columns: repeat(4, 1fr); }
  .choices.two { grid-template-columns: 1fr; }
  .choice.kana { font-family: inherit; font-size: 1.6rem; padding: 12px 4px; letter-spacing: .05em; }
  .stroke-box { display: flex; justify-content: center; margin: 0 0 14px; }
  .stroke-box svg { width: 190px; height: 190px; border: 3px solid var(--border); border-radius: 14px; background: var(--input-bg); }
  .stroke-box path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .stk { stroke: var(--text); stroke-width: 3.5; }
  .stk-hi { stroke: var(--ng); stroke-width: 7; }
  .stk-ghost { stroke: var(--border); stroke-width: 3.5; }
  .stk-num { font-size: 8px; fill: var(--muted); font-weight: 700; font-family: system-ui, sans-serif; }
  .stk-num.hi { fill: var(--ng); }
  .crow { border-top: 2px dashed var(--border); padding-top: 10px; margin-top: 4px; }
  .crow .sentence { margin-bottom: 8px; font-size: 1.35rem; }
  .crow .sentence .hl.kj { font-size: 2rem; }
  .chips { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; margin-bottom: 10px; }
  .chip { padding: 8px 16px; font-size: 1.25rem; background: var(--tile-bg); color: var(--text); border: 2px solid var(--accent); }
  .chip.sel { background: var(--accent); color: var(--accent-text); }
  .word-big { text-align: center; font-size: 3.6rem; line-height: 1.3; margin: 0 0 8px; }
  .reading-line { text-align: center; font-size: 1.8rem; letter-spacing: .08em; margin: 0 0 16px; }
  .reading-line .box { display: inline-block; width: 1.4em; border: 3px dashed var(--accent); border-radius: 8px; background: var(--hl); }
  .pair-q { text-align: center; font-size: 2rem; margin: 6px 0 18px; }
  .pair-q .hint { font-size: 2.2rem; }
  .pair-q .dots { color: var(--muted); margin: 0 6px; }
  .credit { color: var(--muted); font-size: .7rem; text-align: center; margin-top: 18px; }
  .credit a { color: inherit; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🖌️ かんけん10きゅう</h1>
  <p class="sub">1ねんせいの かんじ 80じを ゲームで れんしゅう</p>

  <!-- ホーム -->
  <div id="screen-home" class="card">
    <p class="summary" id="home-summary"></p>
    <p class="set-title">▶ いちまるの じゅんばんで れんしゅう</p>
    <div id="home-sets"></div>
    <button class="btn-sub hidden" id="btn-weak"></button>
    <button class="btn-big btn-mock" id="btn-mock">🏅 もぎテスト（ほんばんと おなじ 7もん）<small style="display:block; font-size:.8rem; opacity:.9;">80% いじょうで ごうかく！</small></button>
    <button class="btn-big btn-gacha hidden" id="btn-gacha-home"></button>
    <label class="row"><input type="checkbox" id="chk-hand"> ✍️ かく もんだいは てがきで（じどうで まるつけ）</label>
    <label class="row"><input type="checkbox" id="chk-sound"> 🔔 ⭕❌の こえを だす</label>
    <button class="btn-sub" id="btn-score">🗺️ かんじマップ（せいせき）</button>
    <button class="btn-sub" id="btn-zukan">🎀 かんじカードずかん</button>
    <p class="note">もんだいは ほんばんと おなじ 7しゅるい：<br>📖よみ ✍️かきじゅん 🔀ちがう よみ 🔤ただしい よみ<br>🧩ひらがな 1じ 🔗なかまの かんじ ✏️かきとり</p>
    <p class="credit">かきじゅん データ：<a href="http://kanjivg.tagaini.net" target="_blank" rel="noopener">KanjiVG</a>（CC BY-SA 3.0）</p>
  </div>

  <!-- クイズ -->
  <div id="screen-quiz" class="hidden">
    <div class="card">
      <div class="progress" id="quiz-progress"></div>
      <div class="bar"><i id="quiz-bar" style="width:0%"></i></div>
      <div id="quiz-ask">
        <span class="qtype" id="q-type"></span>
        <p class="qtext" id="q-text"></p>
        <div id="q-body"></div>
        <!-- よみ・ひらがな1じ：ひらがなカード -->
        <div id="q-cards" class="hidden">
          <div class="slots" id="card-slots"></div>
          <div class="pool" id="card-pool"></div>
          <button class="btn-big" id="btn-check">けってい</button>
        </div>
        <!-- えらぶ もんだい -->
        <div class="choices hidden" id="q-choices"></div>

    "大犬天夕", "人入八", "木林森本休", "日目白田百月", "右石左名",
    "土上王玉正生", "千十子字", "力九男", "口四中円", "水小木",
    "見貝目", "耳手", "早草", "青赤音立", "竹休村町", "川三小", "虫中",
    "花草竹", "空金字", "一二三", "五六七八"
  ];
  /* まちがえやすい ひらがな */
  var KANA_LOOKALIKE = ["あお", "いり", "うら", "きさ", "しつ", "ぬめ", "ねれわ", "はほぼぽ", "まも", "るろ", "たな", "こに", "ゃや", "ゅゆ", "ょよ", "っつ", "がか", "じしぢ", "ずす", "ちさ", "いえ", "うお", "だた", "でて", "ぐく", "ざさ", "びひ", "ぞそ", "おを"];
  var KANA_ANY = "あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわん";

  var TYPES = {
    yomi:   {no: 1, label: "📖 よみ", pts: 2},
    hitsu:  {no: 2, label: "✍️ かきじゅん", pts: 1},
    chigau: {no: 3, label: "🔀 ちがう よみ", pts: 4},
    kana:   {no: 4, label: "🔤 ただしい よみ", pts: 2},
    ichiji: {no: 5, label: "🧩 ひらがな 1じ", pts: 2},
    pair:   {no: 6, label: "🔗 なかまの かんじ", pts: 2},
    kaki:   {no: 7, label: "✏️ かきとり", pts: 2}
  };
  /* かく もんだい（かきとり・なかまの かんじ）を おおめに だす */
  var TYPE_WEIGHT = {yomi: 2, kaki: 5, hitsu: 1, chigau: 1, kana: 1, ichiji: 1, pair: 2};
  /* もぎテスト：ほんばん（20・12・8・5・6・10・20）を みじかく した もの */
  var MOCK_PLAN = [["yomi", 8], ["hitsu", 5], ["chigau", 2], ["kana", 3], ["ichiji", 3], ["pair", 4], ["kaki", 8]];
  var MIN_QUESTIONS = 6;
  var PASS_RATE = 0.8; /* 10きゅうの ごうかくは 150てん中 120てん（80%）くらい */

  /* ---- ガチャの かんじカード（r: 0=ノーマル 1=レア 2=キラキラ） ---- */
  var CARDS = [
    {e:"🐶", k:"犬", n:"いぬ", r:0}, {e:"🌷", k:"花", n:"はな", r:0}, {e:"🐛", k:"虫", n:"むし", r:0},
    {e:"🌙", k:"月", n:"つき", r:0}, {e:"🔥", k:"火", n:"ひ", r:0}, {e:"🌲", k:"森", n:"もり", r:0},
    {e:"🌈", k:"空", n:"そら", r:1}, {e:"💎", k:"玉", n:"たま", r:1}, {e:"🤴", k:"王", n:"おう", r:1},
    {e:"🌟", k:"天", n:"てん", r:2}
  ];
  var RARITY_NAME = ["ノーマル", "⭐ レア", "✨ キラキラ"];
  var RARITY_CLASS = ["", "rare", "kira"];

  var $ = function(id){ return document.getElementById(id); };
  function pick(a){ return a[Math.floor(Math.random() * a.length)]; }
  function shuffleInPlace(a){
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }
  function strokeCount(k){ return (STROKES[k] || []).length; }
  function isKanji(c){ return ALL_KANJI.indexOf(c) >= 0; }

  /* ---- ぶんを よみこむ ---- */
  function parseSentence(s){
    var out = [], re = /\[(.+?)\|(.+?)\]/g, last = 0, m;
    while ((m = re.exec(s))) {
      if (m.index > last) out.push({t: s.slice(last, m.index)});
      out.push({k: m[1], y: m[2]});
      last = re.lastIndex;
    }
    if (last < s.length) out.push({t: s.slice(last)});
    return out;
  }
  var SENT = SENTENCES.map(parseSentence);
  var MARKS = {}; /* かんじ → [{si, ti, y}] */
  SENT.forEach(function(toks, si){
    toks.forEach(function(tk, ti){
      if (!tk.k) return;
      (MARKS[tk.k] = MARKS[tk.k] || []).push({si: si, ti: ti, y: tk.y});
    });
  });
  function readingsOf(k){
    var out = [];
    (MARKS[k] || []).forEach(function(m){ if (out.indexOf(m.y) < 0) out.push(m.y); });
    return out;
  }
  function wordKanji(w){ return w.split("").filter(isKanji); }

  /* ---- せってい・きろく ---- */
  var soundOn = true, handOn = true;
  var stats = {}, setBest = {}, tickets = [], owned = {};
  try {
    soundOn = localStorage.getItem("kk10_sound") !== "0";
    handOn = localStorage.getItem("kk10_hand") !== "0";
    var s0 = JSON.parse(localStorage.getItem("kk10_stats") || "{}");
    if (s0 && typeof s0 === "object") stats = s0;
    var sb0 = JSON.parse(localStorage.getItem("kk10_set_best") || "{}");
    if (sb0 && typeof sb0 === "object") setBest = sb0;
    var tk0 = JSON.parse(localStorage.getItem("kk10_tickets") || "[]");
    if (Array.isArray(tk0)) tickets = tk0;
    var ow0 = JSON.parse(localStorage.getItem("kk10_cards") || "{}");
    if (ow0 && typeof ow0 === "object") owned = ow0;
  } catch (e) {}
  function saveStats(){ try { localStorage.setItem("kk10_stats", JSON.stringify(stats)); } catch (e) {} }
  function saveGacha(){
    try {
      localStorage.setItem("kk10_set_best", JSON.stringify(setBest));
      localStorage.setItem("kk10_tickets", JSON.stringify(tickets));
      localStorage.setItem("kk10_cards", JSON.stringify(owned));
    } catch (e) {}
  }
  function recOf(k){
    if (!stats[k]) stats[k] = {ok: 0, ng: 0, st: 0};
    return stats[k];
  }
  function levelOf(k){
    var r = stats[k];
    if (!r || (r.ok + r.ng) === 0) return "w";
    if (r.st === 0) return "r";
    if (r.st === 1) return "y";
    return "g";
  }
  function weakKanji(){
    return ALL_KANJI.filter(function(k){ var lv = levelOf(k); return lv === "r" || lv === "y"; });
  }

  /* ---- ⭕❌の こえ ---- */
  var OK_PHRASES = ["せいかい！", "すごい！", "やったね！", "ばっちり！"];
  var NG_PHRASES = ["おしい！", "ドンマイ！"];
  function playSound(ok){
    if (!soundOn || !window.speechSynthesis) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(pick(ok ? OK_PHRASES : NG_PHRASES));
      u.lang = "ja-JP";
      u.pitch = ok ? 1.3 : 1.0;
      window.speechSynthesis.speak(u);
    } catch (e) {}
  }

  var screens = ["home","quiz","result","score","gacha","zukan"];
  function show(name){
    screens.forEach(function(s){ $("screen-"+s).classList.toggle("hidden", s !== name); });
    if (name === "home") refreshHome();
    if (name === "score") refreshScore();
    if (name === "zukan") refreshZukan();
    window.scrollTo(0, 0);
  }

  /* ---- もんだいを つくる ---- */
  function typesFor(k){
    var t = [];
    if (MARKS[k]) t.push("yomi", "kaki");
    if (strokeCount(k) >= 2) t.push("hitsu");
    if (readingsOf(k).length >= 2) t.push("chigau");
    if (WORDS.some(function(w){ return w.w.indexOf(k) >= 0; })) t.push("kana", "ichiji");
    if (PAIRS.some(function(p){ return p.a === k; })) t.push("pair");
    return t;
  }
  function pickType(k, used){
    var bag = [];
    typesFor(k).forEach(function(t){
      var w = TYPE_WEIGHT[t];
      if (used && used[t + k]) w = Math.max(0, w - 2); /* おなじ かんじは ちがう しゅるいで */
      for (var i = 0; i < w; i++) bag.push(t);
    });
    return bag.length ? pick(bag) : pick(typesFor(k));
  }
  function makeQ(k, t, usedSent){
    usedSent = usedSent || {};
    if (t === "yomi" || t === "kaki") {
      var ms = (MARKS[k] || []).filter(function(m){ return !usedSent[m.si]; });
      var m = pick(ms.length ? ms : MARKS[k]);
      usedSent[m.si] = true;
      return {t: t, k: k, ks: [k], toks: SENT[m.si], ti: m.ti};
    }
    if (t === "hitsu") {
      var n = strokeCount(k);
      return {t: t, k: k, ks: [k], stroke: 1 + Math.floor(Math.random() * n)};
    }
    if (t === "chigau") {
      /* ちがう よみの ぶんを 2つ */
      var byY = {};
      MARKS[k].forEach(function(mk){ (byY[mk.y] = byY[mk.y] || []).push(mk); });
      var ys = shuffleInPlace(Object.keys(byY)).slice(0, 2);
      var rows = ys.map(function(y){ var mk = pick(byY[y]); return {toks: SENT[mk.si], ti: mk.ti, y: y}; });
      var opts = readingsOf(k).slice();
      while (opts.length < 4) {
        var other = pick(ALL_KANJI.filter(function(c){ return c !== k && MARKS[c]; }));
        var y2 = pick(readingsOf(other));
        if (opts.indexOf(y2) < 0) opts.push(y2);
      }
      return {t: t, k: k, ks: [k], rows: rows, opts: shuffleInPlace(opts.slice(0, Math.max(4, readingsOf(k).length)))};
    }
    if (t === "kana" || t === "ichiji") {
      var w = pick(WORDS.filter(function(x){ return x.w.indexOf(k) >= 0; }));
      var q = {t: t, k: k, ks: wordKanji(w.w), w: w};
      if (t === "ichiji") {
        var idx = 0;
        while (idx < w.r.length && w.r[idx] === w.x[idx]) idx++;
        if (idx >= w.r.length) idx = Math.floor(Math.random() * w.r.length);
        q.idx = idx;
        q.ans = w.r[idx];
      }
      return q;
    }
    var p = pick(PAIRS.filter(function(x){ return x.a === k; }));
    return {t: "pair", k: k, ks: [k], p: p};
  }
  function buildSet(kanji){
    var count = Math.max(kanji.length, MIN_QUESTIONS);
    var order = [];
    while (order.length < count) order = order.concat(shuffleInPlace(kanji.slice()));
    order = order.slice(0, count);
    var used = {}, usedSent = {};
    return shuffleInPlace(order.map(function(k){
      var t = pickType(k, used);
      used[t + k] = true;
      return makeQ(k, t, usedSent);
    }));
  }
  function buildMock(){
    var qs = [], usedSent = {};
    MOCK_PLAN.forEach(function(row){
      var t = row[0];
      var cand = shuffleInPlace(ALL_KANJI.filter(function(k){ return typesFor(k).indexOf(t) >= 0; }));
      cand.slice(0, row[1]).forEach(function(k){ qs.push(makeQ(k, t, usedSent)); });
    });
    return qs;
  }

  /* ---- クイズ ---- */
  var queue = [], pos = 0, misses = [], currentSetKey = null, isMock = false, answered = false;
  var gotPts = 0, maxPts = 0, okCount = 0, secPts = {};
  function startQuiz(qs, key, mock){
    if (!qs.length) return;
    queue = qs;
    currentSetKey = key || null;
    isMock = !!mock;
    pos = 0; misses = []; gotPts = 0; maxPts = 0; okCount = 0; secPts = {};
    show("quiz");
    ask();
  }
  function startSet(kanji, key){ startQuiz(buildSet(kanji), key); }

  /* ぶんを ならべる。mode: yomi＝かんじに せん / kaki＝よみを わくに / done＝こたえ */
  function sentenceEl(toks, ti, mode){
    var box = el("div", "sentence");
    var target = toks[ti].k;
    toks.forEach(function(tk, i){
      if (!tk.k) { box.appendChild(document.createTextNode(tk.t)); return; }
      if (i === ti) {
        if (mode === "kaki") box.appendChild(el("span", "box", tk.y));
        else box.appendChild(el("span", "hl kj", tk.k));
      } else if (mode === "kaki" && tk.k === target) {
        box.appendChild(document.createTextNode(tk.y)); /* こたえが みえない ように */
      } else {
        box.appendChild(el("span", "kj", tk.k));
      }
    });
    return box;
  }
  function plainSentence(toks){
    return toks.map(function(tk){ return tk.k || tk.t; }).join("");
  }

  /* かきじゅんの え（hi：あかく する ばんごう、nums：ばんごうを だす） */
  function strokeSvg(k, hi, nums){
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 109 109");
    (STROKES[k] || []).forEach(function(d, i){
      var p = document.createElementNS(ns, "path");
      p.setAttribute("d", d);
      p.setAttribute("class", i + 1 === hi ? "stk stk-hi" : "stk");
      svg.appendChild(p);
      if (nums) {
        var m = /M\s*([\d.]+)[ ,]([\d.]+)/.exec(d);
        if (m) {
          var t = document.createElementNS(ns, "text");
          t.setAttribute("x", Math.max(2, Number(m[1]) - 7));
          t.setAttribute("y", Math.max(8, Number(m[2]) - 2));
          t.setAttribute("class", i + 1 === hi ? "stk-num hi" : "stk-num");
          t.textContent = i + 1;
          svg.appendChild(t);
        }
      }
    });
    return svg;
  }
  var animTimers = [];
  function animateStrokes(box, k, hi){
    animTimers.forEach(clearTimeout);
    animTimers = [];
    box.innerHTML = "";
    var svg = strokeSvg(k, hi, true);
    box.appendChild(svg);
    var still = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (still) return;
    var paths = svg.querySelectorAll("path"), texts = svg.querySelectorAll("text");
    Array.prototype.forEach.call(texts, function(t){ t.style.opacity = 0; });
    Array.prototype.forEach.call(paths, function(p, i){
      var len = p.getTotalLength ? p.getTotalLength() : 100;
      p.style.strokeDasharray = len;
      p.style.strokeDashoffset = len;
      animTimers.push(setTimeout(function(){
        p.style.transition = "stroke-dashoffset .45s linear";
        p.style.strokeDashoffset = 0;
        if (texts[i]) texts[i].style.opacity = 1;
      }, 300 + i * 600));
    });
  }

  function ask(){
    var q = queue[pos];
    answered = false;
    $("quiz-ask").classList.remove("hidden");
    $("quiz-fb").classList.add("hidden");
    var info = TYPES[q.t];
    $("quiz-progress").textContent = (isMock ? "🏅 もぎテスト　" : "") + (pos + 1) + " / " + queue.length;
    $("quiz-bar").style.width = (pos / queue.length * 100) + "%";
    $("q-type").textContent = (isMock ? "だい" + info.no + "もん　" : "") + info.label;
    ["q-cards", "q-choices", "q-hand", "btn-chigau-check"].forEach(function(id){ $(id).classList.add("hidden"); });
    var body = $("q-body");
    body.innerHTML = "";

    if (q.t === "yomi") {
      $("q-text").textContent = "いろの ついた かんじの よみがなを カードで ならべよう";
      body.appendChild(sentenceEl(q.toks, q.ti, "yomi"));
      setupCards(q.toks[q.ti].y);
    } else if (q.t === "hitsu") {
      $("q-text").textContent = "あかい ところは なんばんめに かくかな？ ばんごうを えらぼう";
      var sb = el("div", "stroke-box");
      sb.appendChild(strokeSvg(q.k, q.stroke, false));
      body.appendChild(sb);
      var nums = [];
      for (var i = 1; i <= strokeCount(q.k); i++) nums.push(i);
      renderChoices(nums.map(function(n){ return {v: String(n), label: String(n), cls: "choice num"}; }), "nums");
    } else if (q.t === "chigau") {
      $("q-text").textContent = "おなじ かんじでも よみかたが ちがうよ。よみがなを えらぼう";
      q.sel = [null, null];
      q.rows.forEach(function(r, ri){
        var row = el("div", "crow");
        row.appendChild(sentenceEl(r.toks, r.ti, "yomi"));
        var chips = el("div", "chips");
        q.opts.forEach(function(o){
          var c = el("button", "chip", o);
          c.addEventListener("click", function(){
            q.sel[ri] = o;
            Array.prototype.forEach.call(chips.children, function(b){ b.classList.toggle("sel", b === c); });
            $("btn-chigau-check").disabled = q.sel.indexOf(null) >= 0;
          });
          chips.appendChild(c);
        });
        row.appendChild(chips);
        body.appendChild(row);
      });
      $("btn-chigau-check").disabled = true;
      $("btn-chigau-check").classList.remove("hidden");
    } else if (q.t === "kana") {
      $("q-text").textContent = "ことばの ただしい よみかたは どっち？";
      body.appendChild(el("div", "word-big kj", q.w.w));
      renderChoices(shuffleInPlace([q.w.r, q.w.x]).map(function(r){ return {v: r, label: r, cls: "choice kana"}; }), "two");
    } else if (q.t === "ichiji") {
      $("q-text").textContent = "□に はいる ひらがなを 1じ えらぼう";
      body.appendChild(el("div", "word-big kj", q.w.w));
      var line = el("div", "reading-line");
      line.appendChild(document.createTextNode(q.w.r.slice(0, q.idx)));
      line.appendChild(el("span", "box", " "));
      line.appendChild(document.createTextNode(q.w.r.slice(q.idx + 1)));
      body.appendChild(line);
      renderChoices(kanaChoices(q.ans, q.w.x[q.idx]).map(function(c){ return {v: c, label: c, cls: "choice kana"}; }), "");
    } else if (q.t === "pair") {
      $("q-text").textContent = "なかまの ことばだよ。□に はいる かんじは どれ？";
      var pq = el("div", "pair-q");
      pq.appendChild(el("span", "hint kj", q.p.h));
      pq.appendChild(el("span", "dots", "…"));
      pq.appendChild(el("span", "box", q.p.y));
      if (q.p.o) pq.appendChild(el("span", "kj", q.p.o));
      var wrap = el("div", "sentence");
      wrap.appendChild(pq);
      body.appendChild(wrap);
      askKanji(q.k);
    } else {
      $("q-text").textContent = "□の ところを かんじで かこう";
      body.appendChild(sentenceEl(q.toks, q.ti, "kaki"));
      askKanji(q.k);
    }
  }
  function askKanji(k){
    if (handOn) {
      $("q-hand").classList.remove("hidden");
      setupPad(k);
    } else {
      renderChoices(kanjiChoices(k).map(function(c){ return {v: c, label: c, cls: "choice kj"}; }), "");
    }
  }
  function kanjiChoices(ans){
    var near = [];
    LOOKALIKE.forEach(function(g){
      if (g.indexOf(ans) >= 0) g.split("").forEach(function(c){ if (c !== ans && near.indexOf(c) < 0) near.push(c); });
    });
    shuffleInPlace(near);
    var out = [ans].concat(near.slice(0, 3));
    while (out.length < 4) {
      var c = pick(ALL_KANJI);
      if (out.indexOf(c) < 0) out.push(c);
    }
    return shuffleInPlace(out);
  }
  function kanaChoices(ans, trap){
    var out = [ans];
    if (trap && trap !== ans) out.push(trap);
    KANA_LOOKALIKE.forEach(function(g){
      if (g.indexOf(ans) >= 0) g.split("").forEach(function(c){ if (out.indexOf(c) < 0) out.push(c); });
    });
    out = [ans].concat(shuffleInPlace(out.slice(1)).slice(0, 3));
    while (out.length < 4) {
      var c = pick(KANA_ANY.split(""));
      if (out.indexOf(c) < 0) out.push(c);
    }
    /* ただしい こたえと わなは かならず のこす */
    if (trap && out.indexOf(trap) < 0) out[3] = trap;
    return shuffleInPlace(out);
  }
  function renderChoices(list, mod){
    var box = $("q-choices");
    box.className = "choices" + (mod ? " " + mod : "");
    box.innerHTML = "";
    list.forEach(function(c){
      var b = el("button", c.cls, c.label);
      b.addEventListener("click", function(){ judgeSimple(c.v, c.label); });
      box.appendChild(b);
    });
  }
  $("btn-chigau-check").addEventListener("click", function(){
    var q = queue[pos];
    if (q.sel.indexOf(null) >= 0) return;
    var right = q.rows.filter(function(r, i){ return q.sel[i] === r.y; }).length;
    finishAnswer(right === q.rows.length, right / q.rows.length, q.sel.join("・"));
  });

  /* ---- ひらがなカード（タップ or ドラッグで わくに いれる） ---- */
  var tiles = [], slotTile = [];
  function setupCards(ans){
    var chars = ans.split("");
    var decoy = kanaDecoys(ans, chars.length <= 2 ? 3 : 2);
    tiles = shuffleInPlace(chars.concat(decoy).map(function(c){ return {ch: c, rot: Math.round(Math.random() * 16 - 8)}; }));
    slotTile = chars.map(function(){ return -1; });
    renderCards();
    $("q-cards").classList.remove("hidden");
  }
  function kanaDecoys(ans, count){
    var out = [];
    ans.split("").forEach(function(c){
      KANA_LOOKALIKE.forEach(function(g){
        if (g.indexOf(c) >= 0) g.split("").forEach(function(d){ if (d !== c && ans.indexOf(d) < 0 && out.indexOf(d) < 0) out.push(d); });
      });
    });
    shuffleInPlace(out);
    out = out.slice(0, count);
    while (out.length < count) {
      var d = pick(KANA_ANY.split(""));
      if (ans.indexOf(d) < 0 && out.indexOf(d) < 0) out.push(d);
    }
    return out;
  }
  function cardsFull(){ return slotTile.every(function(t){ return t >= 0; }); }
  function cardAnswer(){ return slotTile.map(function(t){ return t >= 0 ? tiles[t].ch : ""; }).join(""); }
  function renderCards(){
    var sb = $("card-slots"), pb = $("card-pool");
    sb.innerHTML = ""; pb.innerHTML = "";
    slotTile.forEach(function(t, i){
      var d = el("div", "slot");
      d.setAttribute("data-slot", i);
      if (t >= 0) d.appendChild(makeTile(t, false));
      sb.appendChild(d);
    });

  function makeTile(ti, inPool){
    var tile = el("div", "tile", tiles[ti].ch);
    if (inPool) tile.style.transform = "rotate(" + tiles[ti].rot + "deg)";
    var drag = null;
    tile.addEventListener("pointerdown", function(ev){
      if (ev.button) return;
      ev.preventDefault();
      drag = {x: ev.clientX, y: ev.clientY, moved: false};
      try { tile.setPointerCapture(ev.pointerId); } catch (e) {}
    });
    tile.addEventListener("pointermove", function(ev){
      if (!drag) return;
      var dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
      if (!drag.moved && dx * dx + dy * dy > 64) { drag.moved = true; tile.classList.add("dragging"); }
      if (drag.moved) tile.style.transform = "translate(" + dx + "px," + dy + "px) scale(1.1)";
    });
    tile.addEventListener("pointerup", function(ev){
      if (!drag) return;
      var moved = drag.moved;
      drag = null;
      if (!moved) { tapTile(ti); return; }
      tile.style.visibility = "hidden";
      var under = document.elementFromPoint(ev.clientX, ev.clientY);
      var s = under && under.closest("[data-slot]");
      dropTile(ti, s ? Number(s.getAttribute("data-slot")) : -1);
    });
    tile.addEventListener("pointercancel", function(){ drag = null; renderCards(); });
    return tile;
  }
  function tapTile(ti){

  }
  function dropTile(ti, to){

      if (from >= 0) slotTile[from] = -1; /* わくの そとに だしたら もどす */
    } else if (to !== from) {

  var padCtx = null, padDrawing = false, padStrokes = [], padK = "", padSize = 240, padLocked = false;
  function setupPad(k){
    var cv = $("pad-canvas");
    var r = window.devicePixelRatio || 1;
    padSize = $("pad").clientWidth || 240;
    cv.width = padSize * r; cv.height = padSize * r;
    padCtx = cv.getContext("2d");
    padCtx.scale(r, r);

    padStrokes = [];
    padLocked = false;
    padDrawing = false;

    $("pad-tools").classList.remove("hidden");

  function redrawPad(){
    padCtx.clearRect(0, 0, padSize, padSize);
    padCtx.lineCap = "round";
    padCtx.lineJoin = "round";
    padCtx.lineWidth = padSize * 0.036;
    padCtx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--pen").trim() || "#23362a";
    var sc = padSize / 109;
    padStrokes.forEach(function(st){
      padCtx.beginPath();
      padCtx.moveTo(st[0][0] * sc, st[0][1] * sc);
      if (st.length === 1) padCtx.lineTo(st[0][0] * sc + .1, st[0][1] * sc + .1);
      for (var i = 1; i < st.length; i++) padCtx.lineTo(st[i][0] * sc, st[i][1] * sc);
      padCtx.stroke();
    });
    var has = padStrokes.length > 0;
    $("btn-pad-show").disabled = !has;
    $("btn-pad-undo").disabled = !has;
    $("btn-pad-clear").disabled = !has;
  }
  function padPoint(ev){
    var rc = $("pad-canvas").getBoundingClientRect();
    var x = (ev.clientX - rc.left) * 109 / rc.width, y = (ev.clientY - rc.top) * 109 / rc.height;
    return [Math.max(0, Math.min(109, x)), Math.max(0, Math.min(109, y))];
  }
  /* わくの なかで ゆびを うごかしても がめんが スクロールしない ように */

  });
  $("pad").addEventListener("pointerdown", function(ev){
    if (!padCtx || padLocked || ev.button) return;
    ev.preventDefault();
    padDrawing = true;
    try { this.setPointerCapture(ev.pointerId); } catch (e) {}
    padStrokes.push([padPoint(ev)]);
    redrawPad();
  });
  $("pad").addEventListener("pointermove", function(ev){
    if (!padDrawing) return;
    ev.preventDefault();
    var st = padStrokes[padStrokes.length - 1], p = padPoint(ev), last = st[st.length - 1];
    if (Math.hypot(p[0] - last[0], p[1] - last[1]) < 0.6) return;
    st.push(p);
    var sc = padSize / 109;
    padCtx.beginPath();
    padCtx.moveTo(last[0] * sc, last[1] * sc);
    padCtx.lineTo(p[0] * sc, p[1] * sc);
    padCtx.stroke();
  });
